<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>AutoDataMining Studio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.1/build/stlite.css" />
    <style>
      body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
      #root { height: 100%; width: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.1/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: [
            "pandas",
            "numpy",
            "scikit-learn",
            "matplotlib",
            "openpyxl",
            "autodatamining==0.2.1"
          ],
          entrypoint: "app.py",
          files: {
            "app.py": {
              url: "./app.py"
            }
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
